<div id="search-modal" class="search-modal" role="dialog" aria-modal="true" aria-label="站内搜索" hidden>
  <div class="search-panel">
    <div class="search-bar">
      <input
        id="search-input"
        type="search"
        placeholder="搜索文章…"
        aria-label="搜索关键词"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false">
      <button id="search-close" class="search-close" type="button" aria-label="关闭搜索">✕</button>
    </div>
    <p id="search-status" class="search-status"></p>
    <ul id="search-results" class="search-results"></ul>
    <p class="search-hint">Enter 打开第一条 · Esc 关闭</p>
  </div>
</div>
