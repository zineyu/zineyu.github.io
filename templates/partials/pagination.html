{% if paginator and paginator.number_pagers > 1 %}
<nav class="pagination" aria-label="分页">
  {% if paginator.previous %}
  <a href="{{ paginator.previous }}">« 上一页</a>
  {% else %}
  <span class="is-disabled">« 上一页</span>
  {% endif %}
  <span class="pagination-status">{{ paginator.current_index }} / {{ paginator.number_pagers }}</span>
  {% if paginator.next %}
  <a href="{{ paginator.next }}">下一页 »</a>
  {% else %}
  <span class="is-disabled">下一页 »</span>
  {% endif %}
</nav>
{% endif %}
